# Gemini is opt-in. Keep the API key in the process environment, never in this file.
# Runs automatically on Render, but stays off locally by default.
keepalive.enabled=${KEEP_ALIVE_ENABLED:${RENDER:false}}
keepalive.url=${KEEP_ALIVE_URL:${RENDER_EXTERNAL_URL:}}
keepalive.interval-ms=${KEEP_ALIVE_INTERVAL_MS:600000}
keepalive.initial-delay-ms=${KEEP_ALIVE_INITIAL_DELAY_MS:600000}
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.client=INFO
gemini.enabled=${GEMINI_ENABLED:false}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:8000}
